{% extends "contacts/base.html" %}
{% block title %}Редактирование контакта{% endblock %}
{% block content %}
<h1 class="mb-4">Редактирование контакта #{{ contact.id }}</h1>
<form method="post" class="card p-4">
    {% csrf_token %}
    {{ form.as_p }}
    <div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'db_list' %}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
